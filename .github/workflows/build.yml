name: Build TWRP Xiaomi 17 Ultra (nezha) - HyperOS 4

# Builds TWRP 3.7.1 for Xiaomi 17 Ultra (nezha) from MissMyTime/twrp_device_sm8850.
# That tree (Oct 2026 updates) reads the installed system's Android version and
# security patch at runtime and hands them to KeyMint before decrypting, detects
# the Goodix or Thales Weaver backend, and refuses to write back upgraded key blobs.
# Workflow structure adapted from YuKongA/twrp_device_xiaomi_sm8850.

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      TWRP_MANIFEST_BRANCH:
        description: "TWRP manifest branch"
        required: true
        default: "twrp-16.0"
      DEVICE_REPO_URL:
        description: "Device repo url"
        required: true
        default: "https://github.com/MissMyTime/twrp_device_sm8850"
      DEVICE_REPO_REF:
        description: "Device repo branch or commit"
        required: true
        default: "d76b4dd"
      PIN_TWRP_SOURCES:
        description: "Pin all TWRP-Test projects to 2026-08-23 (the base the device repo was written against)"
        type: boolean
        required: true
        default: true

env:
  CODENAME: nezha

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Build info
      run: |
        echo "BUILD_DATE=$(date +%F)" >> "$GITHUB_ENV"
        {
          echo "Manifest: ${{ github.event.inputs.TWRP_MANIFEST_URL }} (${{ github.event.inputs.TWRP_MANIFEST_BRANCH }})"
          echo "Device repo: ${{ github.event.inputs.DEVICE_REPO_URL }} (${{ github.event.inputs.DEVICE_REPO_REF }})"
          echo "Build date: $(date)"
          echo ""
          echo "Flash to the CURRENT recovery slot only (fastboot boot is not supported):"
          echo "  fastboot getvar current-slot"
          echo "  fastboot --slot=<a|b> flash recovery <this-image>.img"
          echo "Decryption is manual in this build (TW_NO_AUTO_DECRYPT)."
        } > /tmp/INFO.txt

    - name: Free disk space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 16384

    - name: Show free space
      run: |
        df -h "$GITHUB_WORKSPACE"

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    - name: Setup zram (optional)
      continue-on-error: true
      run: |
        sudo apt-get update
        if sudo apt-get install -y "linux-modules-extra-$(uname -r)" zram-tools && sudo modprobe zram; then
          sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
          sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
          sudo systemctl restart zramswap
          zramctl
        else
          echo "zram is not available on this runner kernel; using the 16 GB swap file instead."
        fi
        free -h

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update
        sudo apt install -y repo rsync lz4 zstd
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"

    - name: Sync TWRP source
      run: |
        repo init -u "${{ github.event.inputs.TWRP_MANIFEST_URL }}" -b "${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}" --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync -c --no-tags --no-clone-bundle -j$(nproc --all)
        kill $TIP_PID || true

    - name: Pin TWRP sources to the device repo's baseline
      if: ${{ github.event.inputs.PIN_TWRP_SOURCES == 'true' }}
      run: |
        # The device repo's full-file replacements target TWRP-Test bootable/recovery
        # as of 2026-08-23 17:07 (+08:00): its files still live in minuitwrp/ (renamed
        # to twrpminui/ at 17:16 that day), use libguitwrp (renamed 08-25), and its
        # Android.mk builds the recovery binary (moved to Soong 08-27). Pin every
        # TWRP-Test project to its last commit before 2026-08-23 17:10 +08:00 so the
        # whole tree matches that snapshot.
        pin() {
          git -C "$1" fetch -q --depth=1 "https://github.com/TWRP-Test/$2" "$3"
          git -C "$1" checkout -q -f FETCH_HEAD
          git -C "$1" clean -qfd
          echo "$1 -> $(git -C "$1" log -1 --format='%h %cs %s')" | tee -a /tmp/INFO.txt
        }
        while read -r path repo sha; do
          [ -n "$path" ] && pin "$path" "$repo" "$sha"
        done <<'PINS'
          bootable/recovery              android_bootable_recovery                32afb7287bcc19b4a38380704b846c32f9fab77b
          external/lvgl                  android_external_lvgl                    7cc13aafaa2e7acab6cf3c1977ab6ca70b6c2ed7
          external/libvpx                android_external_libvpx                  718dd469f67964d8f5fd4c8ebf09513bbfa50146
          external/libwebm               android_external_libwebm                 103e46e4cd4b6efcf6001f23fa8665fb110abf8d
          build/make                     android_build                            3b5b2b43b8e2200ef92b7b814a84c8dde8b74121
          build/soong                    android_build_soong                      91bdc79cffb29d35b2d46a33204c061c3e7ed4f7
          external/exfatprogs            android_external_exfatprogs              a227032b66d1256eb912f6c443ae2a00799dbc27
          external/freetype              android_external_freetype                d968d2541f7158e18ab22680bfa08a538019bf6a
          external/icu                   android_external_icu                     6fefff4e125c1b1a332fbce6d0d2da323b203865
          external/scrypt                android_external_scrypt                  19e0168446d3955ab17c56be1f1d1eb92616c44a
          external/wpa_supplicant_8      android_external_wpa_supplicant_8        70643f677105873084d69bdc239297ee0d337871
          frameworks/base                android_frameworks_base                  99b01a65cc4c104933788b3143285ab6bae65827
          hardware/interfaces            android_hardware_interfaces              185265a4c2dccc7f6770ea08eddd36a15b2035b6
          system/core                    android_system_core                      ea939a2ec81a18190dfbd18b2642ddc22af4c0a0
          system/extras                  android_system_extras                    e7a43388bdbb2774b955ed5c7fca1fa83fd61c64
          system/hardware/interfaces     android_system_hardware_interfaces       f3d42be8ff32eb4ff00873bf2762d13c013d314a
          system/keymaster               android_system_keymaster                 1d26bd0ab27ccf3ed1af84e6514026ea4167bf3f
          system/libziparchive           android_system_libziparchive             8c51527debf9394dfa515f7e6c7941d2720c6d01
          system/sepolicy                android_system_sepolicy                  bb100837941584a7d0f8c2969eeaebf9c56da8fc
          system/update_engine           android_system_update_engine             b451120ede75393948160631f699c419f427a692
          system/vold                    android_system_vold                      4c83041ec61f9b482085685f1e6aed5a62f103aa
          vendor/twrp                    android_vendor_twrp                      9633d05e4aa67faf8ed46bb775c77d6cad17fb42
          external/libncurses            android_external_libncurses              cf8d1a3f3b0ab6f9385c3361e1aada7ecc635ad6
          external/se_omapi              android_se_omapi                         637d1911a25ee1f9ee81fded6979a78074ba646f
          external/magisk-prebuilt       external_magisk-prebuilt                 0fc7153ab07e73b8f63a0f5cc9e9ec91dc61ff78
        PINS

    - name: Clone device repo
      run: |
        git clone "${{ github.event.inputs.DEVICE_REPO_URL }}" twrp_device_sm8850
        cd twrp_device_sm8850
        git checkout "${{ github.event.inputs.DEVICE_REPO_REF }}"
        echo "Device repo commit: $(git log -1 --format='%h %ad %s' --date=short)" >> /tmp/INFO.txt
        # The repo sits inside the source root but carries other devices' trees and
        # patch copies (Android.bp/.mk/.go). Tell Soong's finder to skip it; build.sh
        # copies only the nezha tree and patch files into their real locations.
        touch .find-ignore
        # patches/common/files/bootable/recovery/etc/Android.bp redefines
        # init_recovery.rc, which bootable/recovery/Android.bp already defines with the
        # same source (etc/init.rc -> init/hw/init.rc). Soong rejects the duplicate,
        # so drop the copy; the installed init.rc is unchanged.
        rm -f patches/common/files/bootable/recovery/etc/Android.bp

    - name: Build TWRP (sync tree, apply patches, build)
      run: |
        export ALLOW_MISSING_DEPENDENCIES=true
        export SKIP_ABI_CHECKS=true
        export CCACHE_DIR=.ccache
        export CCACHE_EXEC=$(command -v ccache)
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1
        (while true; do echo "$(date +%T) Building TWRP..."; free -h | head -2; sleep 30; done) &
        TIP_PID=$!
        TWRP_SOURCE="$GITHUB_WORKSPACE" bash twrp_device_sm8850/scripts/build.sh "$CODENAME"
        kill $TIP_PID || true
        IMG="out/target/product/${CODENAME}/recovery.img"
        ls -lh "$IMG"
        mv "$IMG" "out/target/product/${CODENAME}/TWRP-3.7.1-nezha-OS4-${BUILD_DATE}.img"

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: out/target/product/${{ env.CODENAME }}/TWRP-3.7.1-nezha-OS4-${{ env.BUILD_DATE }}.img
        name: TWRP-3.7.1-nezha-OS4-${{ env.BUILD_DATE }}-${{ github.run_id }}
        tag_name: nezha-os4-${{ env.BUILD_DATE }}-${{ github.run_id }}
        body_path: /tmp/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
